[graph]
all-features = false

[advisories]
yanked = "deny"
ignore = [
  # basic-toml is unmaintained; only askama_derive (UniFFI's codegen, build time) uses it, and every askama still does.
  { id = "RUSTSEC-2026-0374", reason = "build-time only, through uniffi's askama; no maintained alternative upstream" },
  # chrono is unmaintained, not vulnerable; only cddl (link-phone's schema check) uses it, in its newest release.
  { id = "RUSTSEC-2026-0543", reason = "chrono, through cddl 0.10.7; no cddl without it yet" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "ISC", "BSD-2-Clause", "BSD-3-Clause",
  "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "MPL-2.0", "CC0-1.0", "Unlicense"]
confidence-threshold = 0.9
# Our own crates (publish = false) are GPL-3.0-or-later; the allow list covers dependencies only.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
