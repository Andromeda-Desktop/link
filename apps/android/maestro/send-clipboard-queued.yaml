# Home's Send › Text while the desktop is away: the clip waits for it, and Home says so.
appId: org.andromeda.link
---
- launchApp:
    stopApp: false
# A tap during the launch transition can be lost, and the app stays on its last tab.
- runFlow: go-home.yaml
- tapOn: "Send"
- tapOn: "Text"
- extendedWaitUntil:
    visible: "Will send when .* connects"
    timeout: 10000
- takeScreenshot: ${OUT}/10-will-send
