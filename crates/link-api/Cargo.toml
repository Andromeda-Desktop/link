[package]
name = "link-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
zbus.workspace = true

[target.'cfg(windows)'.dependencies]
async-trait = "0.1"
tokio.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Threading"] }

[build-dependencies]
zbus.workspace = true
zbus_xml = "6"
zbus_xmlgen = { version = "6", default-features = false }

# The Windows pipe module calls Win32 security APIs, so it allows unsafe code; everywhere else denies it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
