[package]
name = "link-window-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The Link window's Link1 transport: link-api behind the C ABI in include/link_ffi.h.
[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
futures-util.workspace = true
link-api.workspace = true
log.workspace = true
tokio.workspace = true
zbus.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

# A C ABI needs unsafe code, so this crate cannot inherit `unsafe_code = "forbid"`.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
