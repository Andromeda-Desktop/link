[package]
name = "link-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
link-proto.workspace = true
base64.workspace = true
bytes.workspace = true
if-addrs.workspace = true
log.workspace = true
mdns-sd.workspace = true
quinn.workspace = true
quinn-proto.workspace = true
ring.workspace = true
rustix = { workspace = true, features = ["net", "process"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
nix = { version = "0.31", default-features = false, features = ["socket", "uio", "net"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
bluer = { version = "0.17.4", default-features = false, features = ["l2cap"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

# The Windows file calls in sys.rs call kernel32, so that module allows unsafe code; everywhere else denies it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
