# The Link window (window/) with the static libdesk of the pinned desktop commit (dist/window/libdesk-commit), one
# package per distro, as artifacts window-<distro>, and the macOS app zip (window-macos), proven on a clean Mac.
# release.yml calls it for a tag; a push that changes the window or its pin checks it here.
name: window
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, window, "ci/**"]
    paths: [window/**, dist/window/**, dist/macos/**, crates/link-window-ffi/**, .github/workflows/window.yml]

permissions:
  contents: read

jobs:
  window:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu, image: "ubuntu:26.04", git: "apt-get update -qq && apt-get install -y -qq git" }
          - { distro: debian, image: "debian:testing", git: "apt-get update -qq && apt-get install -y -qq git" }
          - { distro: fedora, image: "registry.fedoraproject.org/fedora:43", git: "dnf install -y -q git" }
          - { distro: arch, image: "archlinux:latest", git: "pacman -Sy --noconfirm git" }
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      # Without git, checkout downloads a tarball: no history for the version below.
      - run: ${{ matrix.git }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - run: dist/window/deps.sh ${{ matrix.distro }}
      # The window links crates/link-window-ffi (Link1 through link-api), built by cargo from window/meson.build.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - run: git config --global --add safe.directory "$PWD" && echo "PIN=$(cat dist/window/libdesk-commit)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: Andromeda-Desktop/desktop, ref: "${{ env.PIN }}", path: desktop }
      - run: dist/window/build.sh desktop stage
      - run: "! ldd stage/usr/lib/andromeda-link/andromeda-link-app | grep 'not found'"
      # Same version rule as the deb, rpm and arch jobs: the window depends on andromeda-link of the same version.
      - run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#v}
          else v="0~r$(git rev-list --count HEAD).g$(git rev-parse --short HEAD)"; fi
          mkdir -p out
          case ${{ matrix.distro }} in
            ubuntu|debian) dist/window/package-deb.sh stage out "$v" ${{ matrix.distro }} ;;
            fedora) rpmbuild -bb dist/window/andromeda-link-window.spec --define "stage $PWD/stage" \
                      --define "linkversion $v" --define "_rpmdir $PWD/out" ;;
            arch) useradd -m builder && chown -R builder "$PWD"
                  su builder -c "cd dist/window && sed -i 's/^pkgver=.*/pkgver=$(echo "$v" | tr '~' .)/' PKGBUILD \
                    && STAGE=$PWD/stage PKGDEST=$PWD/out makepkg --nodeps --noconfirm" ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "window-${{ matrix.distro }}", path: "out/**/*.*" }


  # Each package in a clean container with only its declared dependencies (andromeda-link aside: a push build has no
  # Link package of its version): every library of the window must resolve.
  install:
    needs: window
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu, image: "ubuntu:26.04" }
          - { distro: debian, image: "debian:testing" }
          - { distro: fedora, image: "registry.fedoraproject.org/fedora:43" }
          - { distro: arch, image: "archlinux:latest" }
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "window-${{ matrix.distro }}", path: pkg }
      - run: |
          set -eu
          p=$(find pkg -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) | head -1)
          case ${{ matrix.distro }} in
            ubuntu|debian)
              apt-get update -qq
              deps=$(dpkg-deb -f "$p" Depends | tr ',' '\n' | grep -v andromeda-link | sed 's/([^)]*)//; s/|.*//' | xargs)
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $deps
              dpkg -i --ignore-depends=andromeda-link "$p" ;;
            fedora)
              rpm -qpR "$p" | grep -v -e andromeda-link -e '^rpmlib(' -e '^/' | sed 's/ *[<>=].*//' > deps
              xargs -a deps -d '\n' dnf install -y -q
              rpm -i --nodeps "$p" ;;
            arch)
              pacman -Syu --noconfirm --needed $(pacman -Qip "$p" | sed -n 's/^Depends On *: //p' | tr ' ' '\n' \
                | grep -v '^andromeda-link' | sed 's/[<>=].*//' | xargs)
              pacman -Udd --noconfirm "$p" ;;
          esac
          missing=$(ldd /usr/lib/andromeda-link/andromeda-link-app | grep 'not found' || true)
          [ -z "$missing" ] || { echo "$missing"; exit 1; }
          test -L /usr/bin/andromeda-link-app && test -d /usr/lib/andromeda-link/assets
          echo "window installs: $(du -sh /usr/lib/andromeda-link | cut -f1)"

  # Andromeda Link.app: the window, linkd and link-session with every non-system dylib inside (dist/macos/build.sh),
  # its meson tests run on the Mac: the mirror decoder decodes H.264 and HEVC with VideoToolbox.
  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, targets: aarch64-apple-darwin }
      - run: echo "PIN=$(cat dist/window/libdesk-commit)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: Andromeda-Desktop/desktop, ref: "${{ env.PIN }}", path: desktop }
      # As the desktop's check-macos.yml: the scripts call GNU sed and realpath and the LLVM Mach-O tools by their
      # Linux names; compiling stays with Apple clang. stb is the Arch package's commit.
      - name: Tools
        run: |
          brew install meson ninja llvm lld pkgconf coreutils gnu-sed protobuf
          mkdir -p /tmp/llvm-tools
          for tool in llvm-otool llvm-install-name-tool llvm-strip llvm-ar llvm-nm; do
            ln -s "$(brew --prefix)/opt/llvm/bin/$tool" /tmp/llvm-tools/
          done
          echo /tmp/llvm-tools >> "$GITHUB_PATH"
          for dir in lld/bin coreutils/libexec/gnubin gnu-sed/libexec/gnubin; do
            echo "$(brew --prefix)/opt/$dir" >> "$GITHUB_PATH"
          done
          git clone -q https://github.com/nothings/stb /tmp/stb-src
          git -C /tmp/stb-src checkout -q 31c1ad37456438565541f4919958214b6e762fb4
          mkdir -p /tmp/stb && cp /tmp/stb-src/*.h /tmp/stb/
      - run: DARWIN_SDK=$(xcrun --show-sdk-path) STB_INCLUDE=/tmp/stb desktop/tools/macos/deps.py
      # A bundle version is at most three numbers: a push build is 0.0.<commit count>.
      - run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=${GITHUB_REF_NAME#v}; else v="0.0.$(git rev-list --count HEAD)"; fi
          dist/macos/build.sh desktop out "$v"
          ditto -c -k --keepParent "out/Andromeda Link.app" out/Andromeda-Link-macos-arm64.zip
          echo "zip: $(du -h out/Andromeda-Link-macos-arm64.zip | cut -f1)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: window-macos, path: out/Andromeda-Link-macos-arm64.zip }

  # A Mac that never built anything installs only the zip: the window loads the agents and shows a pairing QR code.
  macos-proof:
    needs: macos
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: window-macos, path: pkg }
      - run: brew install zbar
      - run: dist/macos/proof.sh pkg/Andromeda-Link-macos-arm64.zip proof
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: proof-macos, path: proof }
